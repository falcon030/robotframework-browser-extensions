name: main
on:
  workflow_dispatch:

jobs:
  test:
    name: Playwright-page-methods
    runs-on: ubuntu-latest
    environment: test
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: python version
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
        cache: 'pip'
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: download and install requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        rfbrowser init
    - name: run robot framework tests
      run: |
        robot --outputdir results Playwright-page-methods
    - name: upload results
      if: '!cancelled()'
      uses: actions/upload-artifact@v4
      with: 
        name: robot results
        path: results
